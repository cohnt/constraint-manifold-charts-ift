# Bimanual IIWA + Schunk grippers over the table, with NO shelves.
#
# This is the IIWA bimanual experiment's models/old_shelves.dmd.yaml
# with the `old_shelves` model and its frame removed, and nothing else changed:
# same arm placement, same gripper attachment frames, same table pose. The
# `package://rby1_whole_body/...` URIs resolve through that repo's package.xml, which
# the loading script registers.
#
# Used by scripts/video/generate_iiwa_iris_meshcat.py. The IRIS segment keeps
# the table -- the region has to be certified against a real obstacle for the
# picture to mean anything -- but drops the shelves, which otherwise enclose the
# arms and hide the motion.

directives:

# Add iiwa_left
- add_model:
    name: iiwa_left
    file: package://rby1_whole_body/models/iiwa14_convex_decimated_collision.urdf

- add_weld:
    parent: world
    child: iiwa_left::base

# Add schunk_left
- add_model:
    name: wsg_left
    file: package://rby1_whole_body/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf

- add_frame:
    name: iiwa_left::wsg_attach
    X_PF:
      base_frame: iiwa_left::iiwa_link_7
      translation: [0, 0, 0.09]
      rotation: !Rpy { deg: [90.0, 0.0, 68.0 ]}

- add_weld:
    parent: iiwa_left::wsg_attach
    child: wsg_left::body

# Add iiwa_right
- add_model:
    name: iiwa_right
    file: package://rby1_whole_body/models/iiwa14_convex_decimated_collision.urdf

- add_frame:
    name: iiwa_right_origin
    X_PF:
      base_frame: world
      translation: [0, 0.765, 0]

- add_weld:
    parent: iiwa_right_origin
    child: iiwa_right::base

# Add schunk_right
- add_model:
    name: wsg_right
    file: package://rby1_whole_body/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf

- add_frame:
    name: iiwa_right::wsg_attach
    X_PF:
      base_frame: iiwa_right::iiwa_link_7
      translation: [0, 0, 0.09]
      rotation: !Rpy { deg: [90.0, 0.0, 68.0 ]}

- add_weld:
    parent: iiwa_right::wsg_attach
    child: wsg_right::body

# Add table
- add_model:
    name: table
    file: package://rby1_whole_body/models/old_table/table_wide.sdf

- add_frame:
    name: table_origin
    X_PF:
      base_frame: world
      translation: [0.4, 0.3825, 0.0]
      rotation: !Rpy { deg: [0., 0., 0.]}

- add_weld:
    parent: table_origin
    child: table::table_body

directives:
  # Add UR5e arm (Drake-compatible URDF with primitive collision geometry)
  - add_model:
      name: ur5e
      file: package://eaik_ift_experiment/models/universal_robots/ur_description/urdf/ur5e_drake_collision.urdf
      default_joint_positions:
        shoulder_pan_joint: [0]
        shoulder_lift_joint: [-1.5707963267948966]
        elbow_joint: [1.5707963267948966]
        wrist_1_joint: [-1.5707963267948966]
        wrist_2_joint: [-1.5707963267948966]
        wrist_3_joint: [0]

  - add_weld:
      parent: world
      child: ur5e::base_link

  # Add WSG gripper with finray fingers
  # Weld to UR5e tool0 frame (standard UR flange interface)
  - add_model:
      name: wsg
      file: package://eaik_ift_experiment/models/wsg_finray/wsg50_110_finray_fingers_box_collision.sdf

  - add_weld:
      parent: ur5e::tool0
      child: wsg::body_frame
      X_PC:
        translation: [0, 0, 0.04]
        rotation: !Rpy { deg: [90, 0, 0] }

  # Add table (primary work surface)
  - add_model:
      name: table
      file: package://drake_models/manipulation_station/table_wide.sdf

  - add_weld:
      parent: world
      child: table::table_body
      X_PC:
        translation: [0.4, 0.0, 0.0]

  # Add second table (robot standing surface)
  - add_model:
      name: table2
      file: package://drake_models/manipulation_station/table_wide.sdf

  - add_weld:
      parent: world
      child: table2::table_body
      X_PC:
        translation: [-0.2, 0.0, 0.0]

